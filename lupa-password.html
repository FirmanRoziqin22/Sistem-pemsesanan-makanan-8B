<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lupa Password - TECHNOFOOD</title>
    <link rel="stylesheet" href="lupa-password.css">
</head>
<body>

    <main class="container">
        <section class="hero">
            <h1>Reset Password</h1>
            <p>
                TECHNOFOOD menyediakan kemudahan untuk mengatur ulang
                password akun Anda. Silakan isi formulir di samping
                dengan benar.
            </p>
            <img
                src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRp6H6SooNQ6Xj8qntLl7oVZTlutiH9_fNRq68QB2tkqTOAP50c8I8rkSaK&s=10"
                alt="Makanan TECHNOFOOD">
        </section>

        <section class="card-login">
            <h2>Lupa Password?</h2>
            <p class="subtitle">
                Masukkan informasi berikut untuk mengatur ulang
                password akun Anda.
            </p>

            <form id="resetForm">
                <div class="form-group">
                    <label for="email">Alamat Email</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="Masukkan alamat email"
                        autocomplete="email"
                        required>
                </div>

                <div class="form-group">
                    <label for="kode">Kode Verifikasi</label>
                    <input
                        type="text"
                        id="kode"
                        placeholder="Masukkan 6 digit kode verifikasi"
                        inputmode="numeric"
                        maxlength="6"
                        required>
                </div>

                <div class="form-group">
                    <label for="password">Password Baru</label>
                    <input
                        type="password"
                        id="password"
                        placeholder="Masukkan password baru"
                        autocomplete="new-password"
                        required>
                </div>

                <button type="submit" class="btn-login">
                    Ubah Password
                </button>

                <p id="message" aria-live="polite"></p>

                <div class="register-link">
                    <a href="login.html">← Kembali ke Login</a>
                </div>
            </form>
        </section>
    </main>

    <footer>
        <div class="footer-content">
            <div>
                <div class="brand-logo">TECHNOFOOD</div>
                <p class="brand-tagline">Makanan Enak, Harga Bersahabat.</p>
            </div>
        </div>
    </footer>

    <script src="lupa-password.js"></script>
</body>
</html>
