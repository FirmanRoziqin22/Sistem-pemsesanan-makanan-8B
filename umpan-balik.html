<body>

    <div class="tulisan-menu">
        <h1>UMPAN BALIK</h1>
        <p>Sampaikan pendapat dan masukan Anda kepada kami</p>
    </div>
    <div class="menu">
        <div class="makanan form-umpan-balik">
            <h3>Formulir Umpan Balik</h3>
            <p>Silakan lengkapi formulir berikut.</p>

            <form id="feedbackForm">
                <label for="nama">Nama</label>
                <input type="text" id="nama" name="nama" placeholder="Masukkan nama Anda" required>

                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Masukkan email Anda" required>

                <label for="jenis">Jenis Masukan</label>
                <select id="jenis" name="jenis" required>
                    <option value="Kritik">Kritik</option>
                    <option value="Saran">Saran</option>
                </select>

                <label for="pesan">Pesan</label>
                <textarea id="pesan" name="pesan" rows="5" placeholder="Tuliskan pesan Anda..." required></textarea>

                <label for="gambar">Lampiran Gambar (opsional)</label>
                <input type="file" id="gambar" name="gambar" accept="image/*">
                <p class="petunjuk">Pilih gambar dari perangkat Anda. Format gambar seperti JPG, PNG, atau GIF.</p>

                <button type="submit">Kirim Umpan Balik</button>
                <p id="pesanSukses" class="pesan-sukses" aria-live="polite"></p>
            </form>
        </div>
    </div>

    <script src="umpan-balik.js"></script>
</body>
